<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <rect width="800" height="450" fill="#0C101A"/>
  <!-- Graph network -->
  <g stroke="rgba(56,189,248,0.25)" stroke-width="1.5">
    <line x1="160" y1="180" x2="280" y2="120"/>
    <line x1="280" y1="120" x2="420" y2="160"/>
    <line x1="420" y1="160" x2="520" y2="100"/>
    <line x1="520" y1="100" x2="640" y2="170"/>
    <line x1="280" y1="120" x2="340" y2="280"/>
    <line x1="420" y1="160" x2="480" y2="290"/>
    <line x1="480" y1="290" x2="600" y2="310"/>
    <line x1="340" y1="280" x2="480" y2="290"/>
    <line x1="160" y1="180" x2="220" y2="320"/>
    <line x1="220" y1="320" x2="340" y2="280"/>
  </g>
  <!-- Nodes -->
  <circle cx="160" cy="180" r="14" fill="#121826" stroke="#38BDF8" stroke-width="2"/>
  <circle cx="280" cy="120" r="22" fill="#121826" stroke="#38BDF8" stroke-width="2"/>
  <circle cx="420" cy="160" r="30" fill="#121826" stroke="#22C55E" stroke-width="2"/>
  <circle cx="520" cy="100" r="16" fill="#121826" stroke="#38BDF8" stroke-width="2"/>
  <circle cx="640" cy="170" r="18" fill="#121826" stroke="#38BDF8" stroke-width="2"/>
  <circle cx="340" cy="280" r="24" fill="#121826" stroke="#38BDF8" stroke-width="2"/>
  <circle cx="480" cy="290" r="20" fill="#121826" stroke="#38BDF8" stroke-width="2"/>
  <circle cx="600" cy="310" r="14" fill="#121826" stroke="#38BDF8" stroke-width="2"/>
  <circle cx="220" cy="320" r="12" fill="#121826" stroke="#38BDF8" stroke-width="2"/>

  <text x="420" y="165" font-family="monospace" font-size="10" fill="#22C55E" text-anchor="middle">CENTROID</text>
  <text x="280" y="124" font-family="monospace" font-size="9" fill="#F8FAFC" text-anchor="middle">COMM_01</text>
  <text x="340" y="284" font-family="monospace" font-size="9" fill="#F8FAFC" text-anchor="middle">COMM_02</text>

  <rect x="24" y="24" width="160" height="24" rx="4" fill="#121826" stroke="rgba(56,189,248,0.3)" stroke-width="1"/>
  <text x="34" y="40" font-family="monospace" font-size="11" fill="#38BDF8">GRAPHRAG // LEIDEN</text>
