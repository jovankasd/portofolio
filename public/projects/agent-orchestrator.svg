<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <rect width="800" height="450" fill="#0C101A"/>
  <defs>
    <linearGradient id="cyanLine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.1"/>
    </linearGradient>
  </defs>
  <!-- Grid background -->
  <g opacity="0.08" stroke="#FFFFFF" stroke-width="1">
    <line x1="100" y1="0" x2="100" y2="450"/>
    <line x1="200" y1="0" x2="200" y2="450"/>
    <line x1="300" y1="0" x2="300" y2="450"/>
    <line x1="400" y1="0" x2="400" y2="450"/>
    <line x1="500" y1="0" x2="500" y2="450"/>
    <line x1="600" y1="0" x2="600" y2="450"/>
    <line x1="700" y1="0" x2="700" y2="450"/>
    <line x1="0" y1="90" x2="800" y2="90"/>
    <line x1="0" y1="180" x2="800" y2="180"/>
    <line x1="0" y1="270" x2="800" y2="270"/>
    <line x1="0" y1="360" x2="800" y2="360"/>
  </g>
  <!-- Architectural Nodes -->
  <circle cx="400" cy="225" r="42" fill="#121826" stroke="#38BDF8" stroke-width="2"/>
  <circle cx="400" cy="225" r="16" fill="#38BDF8" opacity="0.8"/>
  <text x="400" y="295" font-family="monospace" font-size="12" fill="#38BDF8" text-anchor="middle" letter-spacing="2">ROOT ORCHESTRATOR</text>
  
  <!-- Sub nodes -->
  <line x1="400" y1="225" x2="240" y2="150" stroke="url(#cyanLine)" stroke-width="1.5" stroke-dasharray="4 4"/>
  <line x1="400" y1="225" x2="560" y2="150" stroke="url(#cyanLine)" stroke-width="1.5" stroke-dasharray="4 4"/>
  <line x1="400" y1="225" x2="310" y2="330" stroke="url(#cyanLine)" stroke-width="1.5" stroke-dasharray="4 4"/>
  <line x1="400" y1="225" x2="490" y2="330" stroke="url(#cyanLine)" stroke-width="1.5" stroke-dasharray="4 4"/>

  <circle cx="240" cy="150" r="26" fill="#121826" stroke="rgba(255,255,255,0.2)" stroke-width="1.5"/>
  <text x="240" y="154" font-family="monospace" font-size="10" fill="#F8FAFC" text-anchor="middle">TOOL_01</text>

  <circle cx="560" cy="150" r="26" fill="#121826" stroke="rgba(255,255,255,0.2)" stroke-width="1.5"/>
  <text x="560" y="154" font-family="monospace" font-size="10" fill="#F8FAFC" text-anchor="middle">TOOL_02</text>

  <circle cx="310" cy="330" r="24" fill="#121826" stroke="rgba(255,255,255,0.2)" stroke-width="1.5"/>
  <text x="310" y="334" font-family="monospace" font-size="9" fill="#F8FAFC" text-anchor="middle">VERIFY</text>

  <circle cx="490" cy="330" r="24" fill="#121826" stroke="rgba(255,255,255,0.2)" stroke-width="1.5"/>
  <text x="490" y="334" font-family="monospace" font-size="9" fill="#F8FAFC" text-anchor="middle">DISPATCH</text>

  <rect x="24" y="24" width="130" height="24" rx="4" fill="#121826" stroke="rgba(56,189,248,0.3)" stroke-width="1"/>
  <text x="34" y="40" font-family="monospace" font-size="11" fill="#38BDF8">SYSTEM // ACTIVE</text>
</svg>
