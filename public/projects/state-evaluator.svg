<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <rect width="800" height="450" fill="#0C101A"/>
  <!-- Pipeline flow -->
  <g fill="#121826" stroke="rgba(255,255,255,0.15)" stroke-width="1.5">
    <rect x="80" y="190" width="150" height="70" rx="8"/>
    <rect x="325" y="190" width="150" height="70" rx="8"/>
    <rect x="570" y="190" width="150" height="70" rx="8"/>
  </g>
  <path d="M 230 225 L 325 225" stroke="#38BDF8" stroke-width="2" stroke-dasharray="6 4"/>
  <path d="M 475 225 L 570 225" stroke="#22C55E" stroke-width="2"/>
  
  <text x="155" y="222" font-family="monospace" font-size="12" fill="#F8FAFC" text-anchor="middle">INPUT PAYLOAD</text>
  <text x="155" y="240" font-family="monospace" font-size="10" fill="rgba(248,250,252,0.5)" text-anchor="middle">raw string / json</text>

  <text x="400" y="222" font-family="monospace" font-size="12" fill="#38BDF8" text-anchor="middle">ZOD VALIDATOR</text>
  <text x="400" y="240" font-family="monospace" font-size="10" fill="rgba(248,250,252,0.5)" text-anchor="middle">invariant checks</text>

  <text x="645" y="222" font-family="monospace" font-size="12" fill="#22C55E" text-anchor="middle">VERIFIED STATE</text>
  <text x="645" y="240" font-family="monospace" font-size="10" fill="rgba(248,250,252,0.5)" text-anchor="middle">deterministic</text>

  <rect x="24" y="24" width="150" height="24" rx="4" fill="#121826" stroke="rgba(34,197,94,0.3)" stroke-width="1"/>
  <text x="34" y="40" font-family="monospace" font-size="11" fill="#22C55E">RUNTIME GUARDRAIL</text>
</svg>
